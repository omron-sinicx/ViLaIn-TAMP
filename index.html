<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* Immediate anti-FOUC styles */
      body {
        margin: 0;
        padding: 0;
        background-color: #f8f9fa !important;
        font-family: 'Inter', 'Arial', sans-serif;
        overflow: hidden;
      }
      
      /* Loading screen that shows immediately */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #f8f9fa;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        font-family: 'Inter', 'Arial', sans-serif;
      }
      
      #loading-text {
        text-align: center;
        font-size: 18px;
        font-weight: 400;
        color: #666;
        line-height: 1.4;
        animation: pulse 1.5s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      
      /* Hide the loading screen once React renders */
      .react-loaded #loading-screen {
        display: none;
      }
      
      /* Initially hide the root content */
      #root {
        opacity: 0;
        transition: opacity 0.2s ease-in-out;
      }
      
      /* Show root content when React is ready */
      .react-loaded #root {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- Immediate loading screen -->
    <div id="loading-screen">
      <div id="loading-text">
        Loading...
      </div>
    </div>
    
    <!-- React content -->
    <div id="root"></div>
    
    <script type="module" src="/src/pages/index.jsx"></script>
  </body>
</html>
